<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Network & QR Codes — PRINT WITH AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="text-center mb-5">
            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1 mb-2">NETWORK ACCESS</span>
            <h2 class="fw-bold">Active Self-Service Kiosks</h2>
            <p class="text-secondary">Scan the QR code on any kiosk with your smartphone to initiate instant mobile printing.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="k : ${kiosks}">
                <div class="glass-card p-4 text-center h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-secondary" th:text="${k.kioskId}">TAHSIL001</span>
                            <span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${k.status}">ACTIVE</span>
                        </div>
                        <h5 class="fw-bold mb-1 text-slate-900" th:text="${k.name}">Tahsil Office Kiosk</h5>
                        <p class="text-muted small mb-3" th:text="${k.location}">Location</p>

                        <!-- Generated QR Image -->
                        <div class="p-2 bg-white rounded border d-inline-block shadow-sm mb-3">
                            <img th:src="@{/kiosk/qr/{id}(id=${k.kioskId})}" th:alt="${k.name}" style="width: 140px; height: 140px;">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <a th:href="@{/print/new(kioskId=${k.kioskId})}" class="btn btn-primary-custom btn-sm">
                            <i class="bi bi-cloud-arrow-up me-1"></i> Start Print Here
                        </a>
                        <a th:href="@{/kiosk/{id}(id=${k.kioskId})}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-qr-code me-1"></i> Full QR & Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
