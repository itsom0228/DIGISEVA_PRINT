<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Kiosk — PRINT WITH AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div th:if="${errorMessage}" class="alert alert-danger shadow-sm mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Invalid Kiosk</span>
                </div>

                <div class="glass-card p-4 text-center mb-4">
                    <h3 class="fw-bold mb-2">Please Select an Active Kiosk</h3>
                    <p class="text-muted">Choose your current physical kiosk location from the list below:</p>

                    <div class="list-group text-start">
                        <a th:each="k : ${kiosks}" th:href="@{/print/new(kioskId=${k.kioskId})}" 
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${k.name} + ' (' + ${k.kioskId} + ')'">Tahsil Kiosk</h6>
                                <div class="small text-muted" th:text="${k.location}">Location</div>
                            </div>
                            <span class="btn btn-sm btn-primary-custom">Select <i class="bi bi-arrow-right"></i></span>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
