<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order — PRINT WITH AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="glass-card p-4 p-md-5 text-center">
                    <div class="p-3 bg-primary-subtle text-primary rounded-circle d-inline-block mb-3">
                        <i class="bi bi-geo-alt-fill display-5"></i>
                    </div>
                    <h3 class="fw-bold mb-2" th:text="#{track.title}">Track Your Print Order</h3>
                    <p class="text-secondary small mb-4">
                        Enter the secure tracking token provided when your print job was created.
                    </p>

                    <form th:action="@{/order/track}" method="get">
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold">Tracking Token</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white"><i class="bi bi-key-fill text-muted"></i></span>
                                <input type="text" class="form-control" name="token" required
                                       th:placeholder="#{track.search_placeholder}">
                            </div>
                            <div class="form-text">Example format: <code>TRK-XXXX-XXXX-XXXX</code></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-lg btn-primary-custom">
                                <i class="bi bi-search me-1"></i> <span th:text="#{track.btn}">Check Status</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
