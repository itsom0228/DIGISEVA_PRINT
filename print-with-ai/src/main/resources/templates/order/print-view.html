<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Print Document — ' + ${job.publicReference}">Print Document — DIGISEVA PRINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1e293b;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .print-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 1000;
            color: #fff;
        }
        .viewer-container {
            position: absolute;
            top: 56px;
            bottom: 0;
            left: 0;
            right: 0;
        }
        iframe.doc-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media print {
            .print-toolbar {
                display: none !important;
            }
            .viewer-container {
                top: 0;
                position: static;
            }
        }
    </style>
</head>
<body>

    <div class="print-toolbar">
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary px-2 py-1" th:text="${job.publicReference}">PAI-2026-XXXX</span>
            <span class="small text-light text-truncate" style="max-width: 250px;" th:text="${job.originalFilename}">document.pdf</span>
        </div>

        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-warning btn-sm fw-bold px-3 shadow" onclick="triggerPrint()">
                <i class="bi bi-printer-fill me-1"></i> त्वरित प्रिंट करा / Print Now (Ctrl + P)
            </button>
            <a th:href="@{/print/confirmation/{token}(token=${job.trackingToken})}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> स्थिती पृष्ठावर परत जा
            </a>
        </div>
    </div>

    <div class="viewer-container">
        <iframe id="docViewerFrame" class="doc-frame" th:src="@{/print/document/{token}(token=${job.trackingToken})}" title="Document Viewer"></iframe>
    </div>

    <script th:inline="javascript">
        function triggerPrint() {
            const frame = document.getElementById('docViewerFrame');
            if (frame && frame.contentWindow) {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                    return;
                } catch(e) {
                    console.log("Direct iframe print caught, fallback to window.print():", e);
                }
            }
            window.print();
        }

        // Auto trigger print dialog on page load
        window.addEventListener('load', function() {
            setTimeout(function() {
                triggerPrint();
            }, 600);
        });

        // Keyboard Shortcut: Ctrl + P
        window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
                e.preventDefault();
                triggerPrint();
            }
        });
    </script>
</body>
</html>
