<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — DIGISEVA PRINT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 my-auto text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="glass-card p-5">
                    <div class="p-3 bg-danger-subtle text-danger rounded-circle d-inline-block mb-3">
                        <i class="bi bi-exclamation-triangle display-4"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Something Went Wrong</h2>
                    <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your print order.'}">
                        An unexpected error occurred while processing your print order.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/}" class="btn btn-primary-custom">
                            <i class="bi bi-house-door me-1"></i> Return Home
                        </a>
                        <a th:href="@{/print/new}" class="btn btn-secondary-custom">
                            <i class="bi bi-arrow-clockwise me-1"></i> Start New Print
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
