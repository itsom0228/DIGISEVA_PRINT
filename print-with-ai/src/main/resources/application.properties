# ========================================================
# PRINT WITH AI - Default Spring Boot Configuration (H2 Demo)
# ========================================================

spring.application.name=Print with AI
server.port=${SERVER_PORT:8085}

# Profiles
spring.profiles.active=demo

# H2 In-Memory Database Configuration for instant local presentation
spring.datasource.url=jdbc:h2:mem:printwithai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at /h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Multipart / File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Application Base Settings
app.base-url=${APP_BASE_URL:http://localhost:8085}
app.upload.dir=./uploads
app.upload.max-file-size-bytes=10485760
app.storage.retention-minutes=60

# Demonstration Pricing (INR)
app.pricing.bw-per-page=2.00
app.pricing.color-per-page=8.00
app.pricing.duplex-discount=0.50

# Default Admin Credentials
admin.default.username=admin
admin.default.password=admin123

# Optional AI / Ollama Configuration
app.ai.ollama.enabled=false
app.ai.ollama.endpoint=http://localhost:11434/api/generate
app.ai.ollama.model=llama3.2
app.ai.ollama.timeout-ms=3000
